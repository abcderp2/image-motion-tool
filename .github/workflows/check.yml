name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact revision without an external action
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          umask 077
          git init .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Check syntax and behavior
        run: |
          node --check app-core.js
          node --check app.js
          node --check app-image.js
          node --check app-export.js
          node --check app-events.js
          node --check gif-encoder.js
          node --check gif-worker.js
          node --check sw.js
          node scripts/test_app_core.mjs
          node --max-old-space-size=64 scripts/test_gif_encoder.mjs
          node scripts/check_static.mjs
          python3 -m json.tool manifest.webmanifest >/dev/null

      - name: Reject unsafe or external runtime code
        run: |
          ! grep -RInE 'https?://[^" ]+\.(js|css)(\?|"|$)|eval[[:space:]]*\(|new Function[[:space:]]*\(|\.innerHTML[[:space:]]*=' -- index.html app-core.js app.js app-image.js app-export.js app-events.js app.css gif-encoder.js gif-worker.js sw.js
