name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out without an external action
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          umask 077
          git init .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Check files and GIF encoder
        run: |
          test -s index.html
          test -s app.css
          test -s app.js
          test -s gif-encoder.js
          test -s gif-worker.js
          test -s sw.js
          node --check app.js
          node --check gif-encoder.js
          node --check gif-worker.js
          node --check sw.js
          node scripts/test_gif_encoder.mjs
          ! grep -RInE 'https?://[^" ]+\.(js|css)(\?|"|$)|eval\(|new Function\(' -- index.html app.js app.css gif-encoder.js gif-worker.js sw.js
