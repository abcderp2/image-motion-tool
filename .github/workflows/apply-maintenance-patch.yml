# branch-only bootstrap
name: Apply maintenance patch

on:
  push:
    branches:
      - maintenance/build-22-quality

permissions:
  contents: write

concurrency:
  group: apply-maintenance-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply exact maintenance edits
        run: python scripts/apply_maintenance_patch.py

      - name: Run complete checks
        run: |
          node --check app-core.js
          node --check motion-model.js
          node --check gif-retimer.js
          node --check apng-encoder.js
          node --check webp-encoder.js
          node --check app.js
          node --check app-image.js
          node --check app-export.js
          node --check app-events.js
          node --check gif-encoder.js
          node --check gif-worker.js
          node --check sw.js
          node scripts/test_app_core.mjs
          node scripts/test_motion_model.mjs
          node --max-old-space-size=64 scripts/test_gif_encoder.mjs
          node scripts/test_gif_retimer.mjs
          node scripts/test_apng_encoder.mjs
          node scripts/test_webp_encoder.mjs
          node scripts/test_gif_disposal.mjs
          node --max-old-space-size=64 scripts/test_gif_dominant_color.mjs
          node scripts/test_service_worker.mjs
          node scripts/check_static.mjs

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js app-export.js index.html .github/workflows/live-site-check.yml scripts/check_static.mjs
          git add -u -- .github/workflows/apply-maintenance-patch.yml scripts/apply_maintenance_patch.py
          git diff --cached --check
          git commit -m "fix: 説明と公開検査を正確化する"
          git push origin HEAD:maintenance/build-22-quality
