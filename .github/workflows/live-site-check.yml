name: Live site check

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-check
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check published files
        env:
          SITE_URL: https://abcderp2.github.io/image-motion-tool/
        run: |
          python3 -I - <<'PY'
          from __future__ import annotations

          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          checks = (
              (base, ("<title>画像モーションツール</title>", "画像は外部へ送信されません")),
              (base + "app.js?v=1", ("STORAGE_KEY", "exportGif", "serviceWorker")),
              (base + "gif-encoder.js?v=1", ("GIF89a", "encodeIndexedFrames")),
          )

          def fetch(url: str) -> tuple[int, str]:
              last_error = "request failed"
              for attempt in range(12):
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "image-motion-tool-live-check/1.0"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.status, response.read(2_000_000).decode("utf-8", errors="replace")
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError) as error:
                      last_error = str(error)
                      if attempt < 11:
                          time.sleep(10)
              raise RuntimeError(last_error)

          for url, markers in checks:
              status, body = fetch(url)
              if status != 200:
                  raise SystemExit(f"{url}: HTTP {status}")
              for marker in markers:
                  if marker not in body:
                      raise SystemExit(f"{url}: missing marker {marker}")
              print(f"PASSED: {url}")
          PY
