name: Live site check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-site-check
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check published files
        env:
          SITE_URL: https://abcderp2.github.io/image-motion-tool/
          LIVE_TEST_DIR: ${{ runner.temp }}/image-motion-live
        run: |
          python3 -I - <<'PY'
          from __future__ import annotations

          import html.parser
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          base_url = urllib.parse.urlsplit(base)
          output_dir = pathlib.Path(os.environ["LIVE_TEST_DIR"])

          class PageParser(html.parser.HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.application_version = ""
                  self.canonical = ""
                  self.assets: list[str] = []

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  values = dict(attrs)
                  if tag == "meta" and values.get("name") == "application-version":
                      self.application_version = values.get("content") or ""
                  if tag == "link" and values.get("rel") == "canonical":
                      self.canonical = values.get("href") or ""
                  if tag == "script" and values.get("src"):
                      self.assets.append(values["src"] or "")
                  if tag == "link" and values.get("rel") in {"stylesheet", "manifest", "icon"} and values.get("href"):
                      self.assets.append(values["href"] or "")

          def fetch(url: str) -> bytes:
              last_error = "request failed"
              for attempt in range(12):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "image-motion-tool-live-check/22.0",
                          "Cache-Control": "no-cache",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          return response.read(3_000_000)
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError, RuntimeError) as error:
                      last_error = str(error)
                      if attempt < 11:
                          time.sleep(10)
              raise RuntimeError(f"{url}: {last_error}")

          def same_site(url: str) -> bool:
              parsed = urllib.parse.urlsplit(url)
              return (
                  parsed.scheme == base_url.scheme
                  and parsed.netloc == base_url.netloc
                  and parsed.path.startswith(base_url.path)
              )

          index_bytes = fetch(base + "?live-check=" + str(int(time.time())))
          index = index_bytes.decode("utf-8", errors="strict")
          parser = PageParser()
          parser.feed(index)

          if not parser.application_version.isdigit():
              raise SystemExit("index.html: application-version is missing or invalid")
          build_match = re.search(r"画像モーションツール Build (\d+)", index)
          if not build_match or build_match.group(1) != parser.application_version:
              raise SystemExit("index.html: Build number does not match application-version")
          if parser.canonical != base:
              raise SystemExit("index.html: canonical URL is incorrect")

          for marker in (
              "<title>画像モーションツール</title>",
              "画像は外部へ送信されません",
              "動きの速さ",
              "アニメーションWebP",
              "ファイル破損とは限りません",
              "生成済みGIFの速度変更",
          ):
              if marker not in index:
                  raise SystemExit(f"index.html: missing marker {marker}")

          if not parser.assets:
              raise SystemExit("index.html: no local assets found")
          for reference in parser.assets:
              absolute = urllib.parse.urljoin(base, reference)
              if not same_site(absolute):
                  raise SystemExit(f"index.html: external or out-of-scope asset {absolute}")
              fetch(absolute)
              print(f"PASSED: {absolute}")

          files = {
              "app-core.js": ("SETTINGS_VERSION", "validateImageMetadata", "estimateApng", "estimateWebp"),
              "motion-model.js": ("case 'sway'", "case 'pendulum'", "case 'squash'"),
              "gif-retimer.js": ("GIF87a", "inspectGif", "retimeGif", "delayOffset"),
              "apng-encoder.js": ("PNG_SIGNATURE", "acTL", "fdAT", "inspectApng"),
              "webp-encoder.js": ("RIFF", "VP8X", "ANIM", "ANMF"),
              "gif-encoder.js": ("GIF89a", "encodeIndexedFrames", "palette box must contain colors"),
              "app.js": ("ファイル破損とは限りません", "生成したアニメーションWebPそのもの"),
              "app-export.js": ("CanvasのWebP出力を使用しています", "別タブで保存したGIFを開き"),
              "app-events.js": ("serviceWorker", "sw.js?v=22", "updateViaCache: 'none'"),
              "sw.js": ("CACHE_PREFIX", "startsWith(CACHE_PREFIX)", "normalizedNavigationUrl", "ALLOWED_URLS"),
              "scripts/test_motion_model.mjs": ("motion model tests passed",),
              "scripts/test_gif_encoder.mjs": ("GIF encoder decode regression tests passed",),
              "scripts/test_gif_retimer.mjs": ("GIF retimer tests passed",),
              "scripts/test_apng_encoder.mjs": ("APNG encoder tests passed",),
              "scripts/test_webp_encoder.mjs": ("WebP encoder tests passed",),
              "scripts/test_gif_disposal.mjs": ("GIF transparency disposal tests passed",),
              "scripts/test_gif_dominant_color.mjs": ("GIF dominant-color palette tests passed",),
              "scripts/test_service_worker.mjs": ("service worker isolation tests passed",),
          }

          for relative, markers in files.items():
              url = urllib.parse.urljoin(base, relative)
              body = fetch(url)
              text = body.decode("utf-8", errors="strict")
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f"{relative}: missing marker {marker}")
              destination = output_dir / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(body)
              print(f"PASSED: {url}")
          PY

      - name: Test published code
        env:
          LIVE_TEST_DIR: ${{ runner.temp }}/image-motion-live
        run: |
          node "${LIVE_TEST_DIR}/scripts/test_motion_model.mjs"
          node "${LIVE_TEST_DIR}/scripts/test_gif_retimer.mjs"
          node "${LIVE_TEST_DIR}/scripts/test_apng_encoder.mjs"
          node "${LIVE_TEST_DIR}/scripts/test_webp_encoder.mjs"
          node --max-old-space-size=64 "${LIVE_TEST_DIR}/scripts/test_gif_encoder.mjs"
          node "${LIVE_TEST_DIR}/scripts/test_gif_disposal.mjs"
          node --max-old-space-size=64 "${LIVE_TEST_DIR}/scripts/test_gif_dominant_color.mjs"
          node "${LIVE_TEST_DIR}/scripts/test_service_worker.mjs"
