name: Live site check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-site-check
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check published files
        env:
          SITE_URL: https://abcderp2.github.io/image-motion-tool/
        run: |
          python3 -I - <<'PY'
          from __future__ import annotations

          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          checks = (
              (base, ("<title>画像モーションツール</title>", "画像は外部へ送信されません", "app-core.js?v=2")),
              (base + "app.js?v=2", ("loadSettings", "drawFrame")),
              (base + "app-image.js?v=2", ("inspectImageFile", "loadImageFile")),
              (base + "app-export.js?v=2", ("exportGif", "exportStill")),
              (base + "app-events.js?v=2", ("serviceWorker", "imageInput")),
              (base + "app-core.js?v=2", ("SETTINGS_VERSION", "validateImageMetadata")),
              (base + "gif-encoder.js?v=2", ("GIF89a", "paletteFromHistogram")),
              (base + "sw.js?v=2", ("ALLOWED_URLS", "image-motion-tool-v2")),
          )

          def fetch(url: str) -> tuple[int, str]:
              last_error = "request failed"
              for attempt in range(12):
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "image-motion-tool-live-check/2.0"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.status, response.read(3_000_000).decode("utf-8", errors="replace")
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError) as error:
                      last_error = str(error)
                      if attempt < 11:
                          time.sleep(10)
              raise RuntimeError(last_error)

          for url, markers in checks:
              status, body = fetch(url)
              if status != 200:
                  raise SystemExit(f"{url}: HTTP {status}")
              for marker in markers:
                  if marker not in body:
                      raise SystemExit(f"{url}: missing marker {marker}")
              print(f"PASSED: {url}")
          PY
