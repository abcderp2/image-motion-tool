name: Live site check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-site-check
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check published files
        env:
          SITE_URL: https://abcderp2.github.io/image-motion-tool/
          LIVE_TEST_DIR: ${{ runner.temp }}/image-motion-live
        run: |
          python3 -I - <<'PY'
          from __future__ import annotations

          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          output_dir = pathlib.Path(os.environ["LIVE_TEST_DIR"])
          checks = (
              (base, ("<title>画像モーションツール</title>", "Build 9", "app.css?v=3", "app-core.js?v=4", "motion-model.js?v=7", "gif-retimer.js?v=1", "app.js?v=8", "動きの速さ", "GIF内の動作回数", "速度を変えて再生成", "生成済みGIFの速度変更", "保存したGIFを別タブで開く")),
              (base + "motion-model.js?v=7", ("case 'sway'", "pivotY = 0.96", "case 'pendulum'", "pivotY = 0.04", "case 'squash'", "pivotY = 0.92", "sampleLoopKeyframes")),
              (base + "gif-retimer.js?v=1", ("GIF87a", "inspectGif", "retimeGif", "delayOffset", "SPEED_MULTIPLIERS")),
              (base + "app.js?v=8", ("motionModel.motionAt", "setGifPreview", "lastGeneratedGifSettings", "regenerateGifButton", "ImageMotionGifRetimer", "retimedGifPreviewObjectUrl", "URL.revokeObjectURL(gifPreviewObjectUrl)")),
              (base + "app-image.js?v=4", ("inspectImageFile", "loadImageFile", "clearGifPreview")),
              (base + "app-export.js?v=8", ("exportGif", "setGifPreview(gifBlob)", "gif-worker.js?v=5", "core.gifFrameDelay(settings)", "regenerateGifWithSpeed", "loadGifForRetiming", "gifRetimer.retimeGif", "dither: 'none'")),
              (base + "app-events.js?v=8", ("serviceWorker", "sw.js?v=9", "clearGifPreview", "gifRetimeInput", "retimeGifButton", "updateViaCache: 'none'")),
              (base + "app-core.js?v=4", ("SETTINGS_VERSION", "validateImageMetadata", "gifFrameDelay", "squash")),
              (base + "gif-encoder.js?v=5", ("GIF89a", "nextCode > (1 << codeSize)", "palette box must contain colors", "colors.length - 1")),
              (base + "gif-worker.js?v=5", ("gif-encoder.js?v=5", "encodeIndexedFrames")),
              (base + "sw.js?v=9", ("ALLOWED_URLS", "NAVIGATION_URLS", "app.css?v=3", "app-core.js?v=4", "motion-model.js?v=7", "gif-retimer.js?v=1", "app.js?v=8", "app-image.js?v=4", "image-motion-tool-v9")),
              (base + "scripts/test_motion_model.mjs?v=7", ("motion model tests passed", "pivotY", "squash export loop")),
              (base + "scripts/test_gif_encoder.mjs?v=5", ("decodeGifFrames", "GIF encoder decode regression tests passed")),
              (base + "scripts/test_gif_retimer.mjs?v=1", ("GIF retimer tests passed", "delayOffset", "loopCount")),
              (base + "scripts/test_gif_disposal.mjs?v=5", ("transparent full frames must clear the previous frame", "GIF transparency disposal tests passed")),
              (base + "scripts/test_gif_dominant_color.mjs?v=5", ("dominant white must not collapse the palette", "GIF dominant-color palette tests passed")),
          )
          downloads = {
              base + "motion-model.js?v=7": output_dir / "motion-model.js",
              base + "scripts/test_motion_model.mjs?v=7": output_dir / "scripts" / "test_motion_model.mjs",
              base + "gif-retimer.js?v=1": output_dir / "gif-retimer.js",
              base + "gif-encoder.js?v=5": output_dir / "gif-encoder.js",
              base + "scripts/test_gif_encoder.mjs?v=5": output_dir / "scripts" / "test_gif_encoder.mjs",
              base + "scripts/test_gif_retimer.mjs?v=1": output_dir / "scripts" / "test_gif_retimer.mjs",
              base + "scripts/test_gif_disposal.mjs?v=5": output_dir / "scripts" / "test_gif_disposal.mjs",
              base + "scripts/test_gif_dominant_color.mjs?v=5": output_dir / "scripts" / "test_gif_dominant_color.mjs",
          }

          def fetch(url: str) -> tuple[int, bytes]:
              last_error = "request failed"
              for attempt in range(12):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "image-motion-tool-live-check/9.0",
                          "Cache-Control": "no-cache",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.status, response.read(3_000_000)
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError) as error:
                      last_error = str(error)
                      if attempt < 11:
                          time.sleep(10)
              raise RuntimeError(last_error)

          for url, markers in checks:
              status, body_bytes = fetch(url)
              if status != 200:
                  raise SystemExit(f"{url}: HTTP {status}")
              body = body_bytes.decode("utf-8", errors="replace")
              for marker in markers:
                  if marker not in body:
                      raise SystemExit(f"{url}: missing marker {marker}")
              destination = downloads.get(url)
              if destination:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(body_bytes)
              print(f"PASSED: {url}")
          PY

      - name: Test the published motion model and GIF encoder
        env:
          LIVE_TEST_DIR: ${{ runner.temp }}/image-motion-live
        run: |
          node "${LIVE_TEST_DIR}/scripts/test_motion_model.mjs"
          node "${LIVE_TEST_DIR}/scripts/test_gif_retimer.mjs"
          node --max-old-space-size=64 "${LIVE_TEST_DIR}/scripts/test_gif_encoder.mjs"
          node "${LIVE_TEST_DIR}/scripts/test_gif_disposal.mjs"
          node --max-old-space-size=64 "${LIVE_TEST_DIR}/scripts/test_gif_dominant_color.mjs"
