name: Deploy GitHub Pages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-22-static-guidance
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/build-22-static-guidance
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply direct source corrections
        run: |
          python scripts/apply_build22_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test_service_worker.mjs')
          text = path.read_text(encoding='utf-8')
          old = "assert.deepEqual(deletedCaches, ['image-motion-tool-v20']);"
          new = "assert.deepEqual(deletedCaches, ['image-motion-tool-v20', 'image-motion-tool-v21']);"
          if text.count(old) != 1:
              raise SystemExit('service worker test expectation was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run complete checks
        run: |
          node --check app-core.js
          node --check motion-model.js
          node --check gif-retimer.js
          node --check apng-encoder.js
          node --check webp-encoder.js
          node --check app.js
          node --check app-image.js
          node --check app-export.js
          node --check app-events.js
          node --check gif-encoder.js
          node --check gif-worker.js
          node --check sw.js
          node scripts/test_app_core.mjs
          node scripts/test_motion_model.mjs
          node --max-old-space-size=64 scripts/test_gif_encoder.mjs
          node scripts/test_gif_retimer.mjs
          node scripts/test_apng_encoder.mjs
          node scripts/test_webp_encoder.mjs
          node scripts/test_gif_disposal.mjs
          node --max-old-space-size=64 scripts/test_gif_dominant_color.mjs
          node scripts/test_service_worker.mjs
          node scripts/check_static.mjs

      - name: Commit verified source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html app.js app-export.js app-events.js sw.js README.md scripts/check_static.mjs scripts/test_service_worker.mjs .github/workflows/live-site-check.yml .github/workflows/pages.yml
          git add -u -- scripts/apply_build22_patch.py
          git diff --cached --check
          git commit -m "fix: 説明を静的ソースへ統合する"
          git push origin HEAD:fix/build-22-static-guidance
